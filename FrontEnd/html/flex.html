<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      html {
        font-size: 62.5%;
      }
      #contenedor {
        background-color: #ccc;
        width: 100%;
        display: flex;
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: space-between;
        position: absolute;
      }
      .item {
        font-size: 3rem;
        width: 20%;
        height: 100px;
      }
      .item-1 {
        background-color: lightcoral;
      }
      .item-2 {
        background-color: rgb(171, 128, 240);
        position:relative;
        /* order: -1; */
        z-index: 10;
      }
      .item-3 {
        background-color: rgb(22, 185, 203);
        order: -1;
      }
      .item-4 {
        background-color: rgb(245, 13, 13);
      }
      @media (max-width: 768px) {
        #contenedor {
          flex-direction: column;
          align-items: center;
        }
        .item {
          width: 80%;
          margin: 10px 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="contenedor">
      <div class="item item-1">1</div>
      <div class="item item-2">2</div>
      <div class="item item-3">3</div>
      <div class="item item-4">4</div>
    </div>
  </body>
</html>
